<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Giant Portal</title>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script><link rel="stylesheet" href="style.css"></head><body>
<main id="viewport"></main><button id="ui-toggle" aria-label="Hide controls" title="Hide controls" aria-expanded="true" aria-controls="controls content-panel viewer-footer"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path class="panel-mark" d="M9 4v16"/><path class="show-mark" d="M10 9l3 3-3 3"/></svg><span>Controls</span></button><aside id="controls" aria-label="Viewer controls"><div class="heading"><strong>Giant Portal</strong><button id="theme" class="theme-toggle" role="switch" aria-checked="false" aria-label="Night mode" title="Day / night"><span class="toggle-thumb"></span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4a8.5 8.5 0 1 0 11.5 11.5Z"/></svg></button></div>
<div class="views"><button data-view="sweetspot">Front</button></div>

<div class="fov-control"><label for="fov">Field of view</label><output id="fov-value" for="fov">90°</output><input id="fov" type="range" min="25" max="150" step="1" value="90" aria-label="Field of view in degrees"></div><div class="fov-control height-control"><label for="camera-height">Eye height</label><output id="camera-height-value" for="camera-height">1.70 m</output><input id="camera-height" type="range" min="1.2" max="1.9" step="0.01" value="1.7" aria-label="Camera eye height in metres"></div></aside>
<section id="content-panel" aria-label="Screen content"><div class="heading"><strong>Content</strong><button id="content-toggle" aria-expanded="false" aria-controls="content-body" aria-label="Expand content panel" title="Expand content panel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></div><div id="content-body" hidden><div class="screen-input"><label class="upload" for="file-back">back<input id="file-back" type="file" accept="video/mp4,video/webm,image/png,image/jpeg"></label><p id="name-back">back · default</p></div><div class="screen-input"><label class="upload" for="file-left">left<input id="file-left" type="file" accept="video/mp4,video/webm,image/png,image/jpeg"></label><p id="name-left">left · default</p></div><div class="screen-input"><label class="upload" for="file-right">right<input id="file-right" type="file" accept="video/mp4,video/webm,image/png,image/jpeg"></label><p id="name-right">right · default</p></div><div class="screen-input"><label class="upload" for="file-ceiling">ceiling<input id="file-ceiling" type="file" accept="video/mp4,video/webm,image/png,image/jpeg"></label><p id="name-ceiling">ceiling · default</p></div><div class="screen-input"><label class="upload" for="file-ceiling-front">ceiling front<input id="file-ceiling-front" type="file" accept="video/mp4,video/webm,image/png,image/jpeg"></label><p id="name-ceiling-front">ceiling front · default</p></div><div class="row"><button id="default">Reset all videos</button><button id="grid">Test grid</button></div>
<div class="transport"><button id="step-back" aria-label="Previous frame" title="Previous frame"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M18 5L8 12l10 7Z"/></svg></button><button id="play" class="media-play" aria-label="Play" title="Play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l11 7-11 7Z"/></svg></button><button id="step-forward" aria-label="Next frame" title="Next frame"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M6 5l10 7-10 7Z"/></svg></button></div><div id="timeline"><input aria-label="Playback position" id="seek" type="range" min="0" max="2" step="0.033333" value="0"><div id="playback-details" class="time"><span id="time" style="visibility:hidden">0.00 / 2.00 s</span><span>30 fps</span></div></div><p id="status" role="status" hidden></p></div></section><div id="joystick" role="group" aria-label="Drag joystick to move"><span id="joystick-knob"></span></div><footer id="viewer-footer"><span>Drag to look · WASD to move</span><div class="footer-actions"><button id="motion-toggle" aria-pressed="false">Motion view</button><button id="fullscreen" aria-label="Toggle full screen" title="Full screen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button></div><p id="motion-status" role="status" hidden></p></footer><script type="module" src="app.js"></script></body></html>
